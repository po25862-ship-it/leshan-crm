name: Leshan Market Crawl

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Encrypted CRM crawl payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRAWLER_WORK_ROOT: ${{ runner.temp }}/leshan-market
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MARKET_JOB_ENCRYPTION_KEY: ${{ secrets.MARKET_JOB_ENCRYPTION_KEY }}

    steps:
      - name: Check out CRM
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler-worker/requirements.txt

      - name: Install crawler
        run: |
          pip install -r crawler-worker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl, upload to private Drive, and sync Firestore
        env:
          PYTHONPATH: crawler-worker
          MARKET_JOB_PAYLOAD: ${{ inputs.payload }}
        run: |
          python -m app.job \
            --payload "$MARKET_JOB_PAYLOAD"
