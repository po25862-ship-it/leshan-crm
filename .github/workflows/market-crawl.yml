name: Leshan Market Crawl

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Encrypted CRM crawl payload
        required: true
        type: string

permissions:
  contents: read

jobs:
  crawl:
    runs-on: [self-hosted, macOS, ARM64, leshan-market]
    timeout-minutes: 30
    env:
      CRAWLER_WORK_ROOT: /tmp/leshan-market
      SYSTEM_PYTHON: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      MARKET_JOB_ENCRYPTION_KEY: ${{ secrets.MARKET_JOB_ENCRYPTION_KEY }}

    steps:
      - name: Check out CRM
        uses: actions/checkout@v4

      - name: Set up isolated Python environment
        run: |
          "$SYSTEM_PYTHON" -m venv "$RUNNER_TEMP/leshan-crawler-venv"

      - name: Install crawler
        run: |
          "$RUNNER_TEMP/leshan-crawler-venv/bin/pip" install -r crawler-worker/requirements.txt
          "$RUNNER_TEMP/leshan-crawler-venv/bin/python" -m patchright install chromium

      - name: Crawl, upload to private Drive, and sync Firestore
        env:
          PYTHONPATH: crawler-worker
          MARKET_JOB_PAYLOAD: ${{ inputs.payload }}
        run: |
          "$RUNNER_TEMP/leshan-crawler-venv/bin/python" -m app.job \
            --payload "$MARKET_JOB_PAYLOAD"
