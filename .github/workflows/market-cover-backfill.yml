name: Leshan Property Cover Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out CRM
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cover backfill dependencies
        run: |
          pip install -r crawler-worker/requirements-cover.txt

      - name: Backfill official property covers
        env:
          PYTHONPATH: crawler-worker
        run: |
          python -m app.backfill_covers --concurrency 1 --delay 2
