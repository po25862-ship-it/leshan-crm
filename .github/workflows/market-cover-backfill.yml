name: Leshan Property Cover Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: [self-hosted, macOS, ARM64, leshan-market]
    timeout-minutes: 30
    env:
      SYSTEM_PYTHON: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Check out CRM
        uses: actions/checkout@v4

      - name: Set up isolated Python environment
        run: |
          "$SYSTEM_PYTHON" -m venv "$RUNNER_TEMP/leshan-cover-venv"

      - name: Install cover backfill dependencies
        run: |
          "$RUNNER_TEMP/leshan-cover-venv/bin/pip" install -r crawler-worker/requirements-cover.txt

      - name: Backfill official property covers
        env:
          PYTHONPATH: crawler-worker
        run: |
          "$RUNNER_TEMP/leshan-cover-venv/bin/python" -m app.backfill_covers --concurrency 6
